[project]
name = "price-tracker"
version = "0.1.0"
description = "Telegram bot that tracks product prices across online stores and alerts on drops"
readme = "README.md"
authors = [
    { name = "Emilio Parra", email = "emilio.pg95@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # JobQueue is NOT part of the base install; it lives behind this extra and pulls APScheduler.
    "python-telegram-bot[job-queue]>=22.8,<23",
    "httpx>=0.28",
    "selectolax>=0.3.27",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    # Two backends, one schema: SQLite for local runs and the default test suite,
    # Postgres in production and in CI's second test leg. Both drivers are async
    # because the engine is; a sync URL such as `postgresql://` cannot work here.
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    # Charts. Used through Figure + FigureCanvasAgg only, never pyplot — see
    # bot/charts.py for why that distinction is load-bearing for a concurrent bot.
    "matplotlib>=3.10",
    # The IANA timezone database, which Python does NOT ship on Windows: zoneinfo there
    # has an empty TZPATH and reads this package instead, so charts.DISPLAY_TZ raises
    # ZoneInfoNotFoundError without it. It arrives transitively today via APScheduler;
    # depending on that would break the day APScheduler stops needing it.
    "tzdata>=2025.1",
]

[project.scripts]
price-tracker = "price_tracker.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
# Migration bodies are Alembic's output, not hand-written code. Reformatting them makes
# the next `--autogenerate` diff noisy for no gain, and a migration is reviewed against
# the DDL it produces rather than its line width. `alembic/env.py` is ours and is linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ASYNC",# flake8-async: catches blocking calls inside async functions
    "RUF",
]

[tool.ruff.lint.isort]
# There is an `alembic/` directory at the repo root, so ruff infers the installed
# `alembic` package is first-party and sorts its imports with ours.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
# Lets async test functions run without decorating every single one.
asyncio_mode = "auto"
testpaths = ["tests"]
# scripts/ is not a package; this makes the spike importable by its tests.
pythonpath = ["scripts"]
